<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PujaConnect - ব্রাহ্মণ সেবা ও বুকিং প্ল্যাটফর্ম</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            background-color: #FFFDF9;
        }
        .bg-puja-orange {
            background-color: #E65100;
        }
        .bg-puja-dark {
            background-color: #26140A;
        }
        .text-puja-orange {
            color: #E65100;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl relative bg-[#FFFDF9] pb-24">

    <!-- TOP BAR -->
    <header class="p-4 bg-[#FFFDF9] border-b border-orange-100 sticky top-0 z-50 shadow-sm">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-3xl text-puja-orange font-bold">🕉️</span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-puja-dark">PujaConnect</h1>
                    <p id="app-subtitle" class="text-xs text-gray-500 font-medium">পূজো সেবা ও বুকিং প্ল্যাটফর্ম</p>
                </div>
            </div>
            
            <!-- Language Dropdown -->
            <div class="relative">
                <select id="lang-selector" onchange="changeLanguage(this.value)" class="bg-orange-50 border border-orange-200 text-puja-dark rounded-full px-3 py-1 text-xs font-semibold focus:outline-none">
                    <option value="bn">🎯 বাংলা</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="hi">🇮🇳 हिन्दी</option>
                    <option value="sa">🔱 संस्कृतम्</option>
                </select>
            </div>
        </div>
    </header>

    <!-- TAB NAVIGATION (Inspired by Screenshot_20260612-104559_Claude.jpg) -->
    <div class="px-4 py-3">
        <div class="bg-puja-dark p-1 rounded-xl flex">
            <button id="tab-purohit" onclick="switchTab('purohit')" class="w-1/2 bg-puja-orange text-white py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center space-x-2">
                <span>🙏</span> <span id="text-tab-purohit">পুরোহিত প্রোফাইল</span>
            </button>
            <button id="tab-features" onclick="switchTab('features')" class="w-1/2 text-orange-200 hover:text-white py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center space-x-2">
                <span>🔱</span> <span id="text-tab-features">সেবা ও পঞ্জিকা</span>
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="px-4">
        
        <!-- SECTION 1: PUROHIT PROFILES -->
        <div id="section-purohit" class="space-y-4">
            
            <!-- Profile Generator -->
            <div class="bg-orange-50 border border-orange-100 rounded-2xl p-4 shadow-sm">
                <button onclick="toggleProfileForm()" class="w-full flex justify-between items-center font-bold text-puja-dark text-sm">
                    <span id="text-create-title"><i class="fa-solid fa-user-plus mr-1 text-puja-orange"></i> নতুন পুরোহিত প্রোফাইল তৈরি করুন</span>
                    <i id="form-chevron" class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                
                <form id="profile-form" class="mt-4 space-y-3 hidden" onsubmit="saveProfile(event)">
                    <div>
                        <label id="lbl-name" class="block text-xs font-bold text-gray-600 mb-1">পুরোহিতের নাম</label>
                        <input type="text" id="p-name" required placeholder="উদা: পণ্ডিত রামকৃষ্ণ शास्त्री" class="w-full text-sm p-2 rounded-lg border border-orange-200 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label id="lbl-degree" class="block text-xs font-bold text-gray-600 mb-1">যোগ্যতা / ডিগ্রি</label>
                            <input type="text" id="p-degree" required placeholder="উদা: বেদান্ত বিশারদ" class="w-full text-sm p-2 rounded-lg border border-orange-200 focus:outline-none">
                        </div>
                        <div>
                            <label id="lbl-exp" class="block text-xs font-bold text-gray-600 mb-1">অভিজ্ঞতা (বছর)</label>
                            <input type="number" id="p-exp" required placeholder="উদা: ২৫" class="w-full text-sm p-2 rounded-lg border border-orange-200 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label id="lbl-fees" class="block text-xs font-bold text-gray-600 mb-1">ন্যূনতম দক্ষিণা (₹)</label>
                            <input type="number" id="p-fees" required placeholder="উদা: ১৫০১" class="w-full text-sm p-2 rounded-lg border border-orange-200 focus:outline-none">
                        </div>
                        <div>
                            <label id="lbl-loc" class="block text-xs font-bold text-gray-600 mb-1">অবস্থান / জেলা</label>
                            <input type="text" id="p-loc" required placeholder="উদা: কলকাতা" class="w-full text-sm p-2 rounded-lg border border-orange-200 focus:outline-none">
                        </div>
                    </div>
                    <button type="submit" id="btn-submit-profile" class="w-full bg-puja-dark text-white font-bold py-2 text-xs rounded-lg uppercase tracking-wider">প্রোফাইল লাইভ করুন</button>
                </form>
            </div>

            <div id="profiles-container" class="space-y-4">
                <!-- Data Populates Here -->
            </div>
        </div>

        <!-- SECTION 2: FEATURES & UPDATED DONATIONS -->
        <div id="section-features" class="space-y-6 hidden">
            
            <!-- BRIEF PANJIKA -->
            <div class="bg-gradient-to-br from-amber-50 to-orange-100 border border-orange-200 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center space-x-2 border-b border-orange-200 pb-2 mb-3">
                    <span class="text-xl">📅</span>
                    <h3 id="panjika-header" class="font-bold text-puja-dark">সংক্ষেপে আজকের পঞ্জিকা</h3>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="bg-white/80 p-2 rounded-lg border border-orange-100">
                        <span id="panjika-date-lbl" class="text-gray-500 block">তারিখ ও বার:</span>
                        <strong id="panjika-date" class="text-puja-dark">১২ জুন, ২০২৬ | শুক্রবার</strong>
                    </div>
                    <div class="bg-white/80 p-2 rounded-lg border border-orange-100">
                        <span id="panjika-tithi-lbl" class="text-gray-500 block">তিথি:</span>
                        <strong id="panjika-tithi" class="text-puja-dark">কৃষ্ণাদ্বাদশীতিথি</strong>
                    </div>
                    <div class="bg-white/80 p-2 rounded-lg border border-orange-100">
                        <span id="panjika-nakshatra-lbl" class="text-gray-500 block">নক্ষত্র:</span>
                        <strong id="panjika-nakshatra" class="text-puja-dark">ভরনী নক্ষত্র</strong>
                    </div>
                    <div class="bg-white/80 p-2 rounded-lg border border-orange-100">
                        <span id="panjika-muhurta-lbl" class="text-gray-500 block">শুভ মুহূর্ত:</span>
                        <strong id="panjika-muhurta" class="text-[#2E7D32]">সকাল ০৫:২৪ - সকাল ০৭:১১</strong>
                    </div>
                </div>
            </div>

            <!-- EXCLUSIVE DONATION SYSTEM -->
            <div class="bg-white border border-orange-100 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center space-x-2 border-b border-orange-100 pb-2 mb-4">
                    <span class="text-xl text-puja-orange">💳</span>
                    <h3 id="donation-header" class="font-bold text-puja-dark">ডিজিটাল দান ও কল্যাণ তহবিল</h3>
                </div>

                <form onsubmit="handleDonation(event)" class="space-y-4">
                    <div>
                        <label id="lbl-don-cat" class="block text-xs font-bold text-gray-700 mb-1.5">দানের খাত/ক্যাটাগরি নির্বাচন করুন:</label>
                        <div class="space-y-2">
                            <label class="flex items-start p-2.5 rounded-xl border border-orange-100 hover:bg-orange-50/50 cursor-pointer">
                                <input type="radio" name="don_category" value="cat_1" checked class="mt-1 accent-orange-600">
                                <span id="don-cat-1" class="ml-2.5 text-xs font-medium text-gray-800">১. নব উপনীত ব্রাহ্মণদের শিক্ষার ব্যবস্থা উন্নত করতে দান</span>
                            </label>
                            <label class="flex items-start p-2.5 rounded-xl border border-orange-100 hover:bg-orange-50/50 cursor-pointer">
                                <input type="radio" name="don_category" value="cat_2" class="mt-1 accent-orange-600">
                                <span id="don-cat-2" class="ml-2.5 text-xs font-medium text-gray-800">২. গণ বিবাহের জন্য যৌথ দান</span>
                            </label>
                            <label class="flex items-start p-2.5 rounded-xl border border-orange-100 hover:bg-orange-50/50 cursor-pointer">
                                <input type="radio" name="don_category" value="cat_3" class="mt-1 accent-orange-600">
                                <span id="don-cat-3" class="ml-2.5 text-xs font-medium text-gray-800">৩. গণ উপনয়নের আয়োজন ও সহায়তায় দান</span>
                            </label>
                            <label class="flex items-start p-2.5 rounded-xl border border-orange-100 hover:bg-orange-50/50 cursor-pointer">
                                <input type="radio" name="don_category" value="cat_4" class="mt-1 accent-orange-600">
                                <span id="don-cat-4" class="ml-2.5 text-xs font-medium text-gray-800">৪. মন্দির বাস্তবায়নের (নির্মাণ ও সংস্কার) জন্যে দান</span>
                            </label>
                            <label class="flex items-start p-2.5 rounded-xl border border-orange-100 hover:bg-orange-50/50 cursor-pointer">
                                <input type="radio" name="don_category" value="cat_5" class="mt-1 accent-orange-600">
                                <span id="don-cat-5" class="ml-2.5 text-xs font-medium text-gray-800">৫. বিশেষ মনস্কামনা পূরণে সংকল্পের দান</span>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label id="lbl-don-name" class="block text-xs font-bold text-gray-600 mb-1">দাতার নাম</label>
                            <input type="text" id="don-name" required class="w-full text-xs p-2 rounded-lg border border-orange-200">
                        </div>
                        <div>
                            <label id="lbl-don-gotra" class="block text-xs font-bold text-gray-600 mb-1">গোত্র</label>
                            <input type="text" id="don-gotra" required class="w-full text-xs p-2 rounded-lg border border-orange-200">
                        </div>
                    </div>
                    <div>
                        <label id="lbl-don-amount" class="block text-xs font-bold text-gray-600 mb-1">দানের পরিমাণ (₹)</label>
                        <input type="number" id="don-amount" required class="w-full text-xs p-2 rounded-lg border border-orange-200">
                    </div>
                    <button type="submit" id="btn-donate" class="w-full bg-puja-orange text-white font-bold py-2.5 text-sm rounded-xl">ডিজিটাল সংকল্প ও দান করুন</button>
                </form>
            </div>
        </div>
    </main>

    <!-- BOOKING MODAL -->
    <div id="booking-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
            <h4 class="font-bold text-puja-dark border-b pb-2">পূজা সেবা বুকিং ফর্ম</h4>
            <form onsubmit="confirmBooking(event)" class="space-y-3">
                <input type="hidden" id="modal-purohit-id">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">আপনার নাম</label>
                    <input type="text" id="b-user" required class="w-full text-sm p-2 rounded-lg border border-orange-200">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">পূজার ধরণ / উপলক্ষ্য</label>
                    <input type="text" id="b-puja" required class="w-full text-sm p-2 rounded-lg border border-orange-200">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">তারিখ</label>
                    <input type="date" id="b-date" required class="w-full text-sm p-2 rounded-lg border border-orange-200">
                </div>
                <div class="flex space-x-2">
                    <button type="button" onclick="closeBookingModal()" class="w-1/2 bg-gray-200 py-2 rounded-lg text-xs font-bold">বাতিল</button>
                    <button type="submit" class="w-1/2 bg-puja-orange text-white py-2 rounded-lg text-xs font-bold">নিশ্চিত করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CHAT BAR FOOTER -->
    <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-puja-dark p-3 flex items-center justify-between border-t border-orange-950 shadow-2xl z-40">
        <div class="flex items-center space-x-2 bg-[#1F0E06] rounded-full px-4 py-2 w-full border border-orange-900/40">
            <i class="fa-solid fa-plus text-orange-400/70 text-sm"></i>
            <input type="text" id="footer-search" placeholder="ক্যাটাগরি বা সেবা খুঁজুন..." class="bg-transparent text-white text-xs w-full focus:outline-none">
            <i class="fa-solid fa-microphone text-orange-400/70 text-sm"></i>
        </div>
        <div class="ml-3 bg-puja-orange p-2 rounded-full">
            <i class="fa-solid fa-paper-plane text-white text-xs"></i>
        </div>
    </footer>

                donCat5: "५. मनोकामना पूर्ति संकल्प हेतु विशेष दान", lblDonName: "दाता का नाम", lblDonGotra: "गोत्र", lblDonAmount: "राशि (₹)",
                btnDonate: "डिजिटल संकल्प और दान करें", footerPlaceholder: "सेवा खोजें...", verified: "✓ सत्यापित",
                experience: "वर्ष अनुभव", totalPuja: "कुल पूजा", rating: "रेटिंग", reviews: "समीक्षाएं", available: "अभी उपलब्ध", from: "से शुरू", btnBook: "बुक करें"
            },
            sa: {
                subtitle: "पूजा सेवा च आरक्षण मञ्चः", tabPurohit: "पुरोहित विवरणिका", tabFeatures: "सेवा च पञ्चाङ्गम्",
                createTitle: "नूतन पुरोहित विवरणिकां रचयन्तु", lblName: "पुरोहितस्य नाम", lblDegree: "उपाधिः",
                lblExp: "अनुभवः (वर्षाणि)", lblFees: "न्यूनतम दक्षिणा (₹)", lblLoc: "स्थानम्", btnSubmitProfile: "विवरणিকাं प्रकाशयन्तु",
                panjikaHeader: "अद्यतन संक्षिप्त पञ्चाङ्गम्", panjikaDateLbl: "तिथिवासरौ:", panjikaDate: "१२ जून, २०२६ | भृगुवासरः",
                panjikaTithiLbl: "तिथिः:", panjikaTithi: "कृष्णपक्ष द्वादशी", panjikaNakshatraLbl: "नक्षत्रम्:", panjikaNakshatra: "भरणी",
                panjikaMuhurtaLbl: "शुभमुहूर्तः:", panjikaMuhurta: "०५:२४ - ०७:११", donationHeader: "डिजिटल दानम् एवं कोषः",
                lblDonCat: "दानश्रेणीं चिनोतु:", donCat1: "१. नव उपनीत ब्राह्मणानां शिक्षण सुधायै दानम्",
                donCat2: "२. सामूहिक विवाह आयोजनार्थं संयुक्त दानम्", donCat3: "३. सामूहिक उपनयन संस्कार सहायतार्थं दानम्", donCat4: "४. मन्दिर निर्माणाय एवं जीर्णोद्धाराय दानम्",
                donCat5: "५. मनोकामना पूर्तये विशेष संकल्प दानम्", lblDonName: "दातुः नाम", lblDonGotra: "गोत्रम्", lblDonAmount: "दान राशिः (₹)",
                btnDonate: "डिजिटल संकल्पं कृत्वा दानं ददातु", footerPlaceholder: "सेवा अन्विष्यन्तु...", verified: "✓ प्रमाणीकृत",
                experience: "वर्षानुभवः", totalPuja: "कुल पूजाः", rating: "मूल्याङ्कनम्", reviews: "समीक्षाः", available: "अधुना उपलब्धः", from: "आरभ्य", btnBook: "आरक्षणं कुरु"
            }
        };

        let defaultProfiles = [{
            id: 1, name: "পণ্ডিত रामकृष्ण शास्त्री", degree: "বেদান্ত বিশারদ", experience: "২৮", totalPuja: "২,৮৪০", rating: "৪.৯★", reviews: "৩১২", location: "কলকাতা", fees: "১,৫০১", avatar: "https://api.dicebear.com/7.x/bottts-neutral/svg?seed=priest1"
        }];

        let currentLang = "bn";

        window.onload = function() {
            if(!localStorage.getItem("puja_profiles")) localStorage.setItem("puja_profiles", JSON.stringify(defaultProfiles));
            changeLanguage("bn");
        };

        function switchTab(tab) {
            document.getElementById("section-purohit").classList.toggle("hidden", tab !== 'purohit');
            document.getElementById("section-features").classList.toggle("hidden", tab === 'purohit');
            document.getElementById("tab-purohit").className = tab === 'purohit' ? "w-1/2 bg-puja-orange text-white py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center space-x-2" : "w-1/2 text-orange-200 hover:text-white py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center space-x-2";
            document.getElementById("tab-features").className = tab !== 'purohit' ? "w-1/2 bg-puja-orange text-white py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center space-x-2" : "w-1/2 text-orange-200 hover:text-white py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center space-x-2";
        }

        function toggleProfileForm() {
            const form = document.getElementById("profile-form");
            form.classList.toggle("hidden");
            document.getElementById("form-chevron").className = form.classList.contains("hidden") ? "fa-solid fa-chevron-down text-xs" : "fa-solid fa-chevron-up text-xs";
        }

        function saveProfile(e) {
            e.preventDefault();
            const profiles = JSON.parse(localStorage.getItem("puja_profiles")) || [];
            profiles.push({
                id: Date.now(),
                name: document.getElementById("p-name").value,
                degree: document.getElementById("p-degree").value,
                experience: document.getElementById("p-exp").value,
                totalPuja: "0", rating: "5.0★", reviews: "0",
                location: document.getElementById("p-loc").value,
                fees: Number(document.getElementById("p-fees").value).toLocaleString('en-IN'),
                avatar: "https://api.dicebear.com/7.x/bottts-neutral/svg?seed=" + Math.random()
            });
            localStorage.setItem("puja_profiles", JSON.stringify(profiles));
            renderProfiles();
            document.getElementById("profile-form").reset();
            toggleProfileForm();
            alert("প্রোফাইল সফলভাবে সংরক্ষিত হয়েছে!");
        }

        function renderProfiles() {
            const container = document.getElementById("profiles-container");
            container.innerHTML = "";
            (JSON.parse(localStorage.getItem("puja_profiles")) || []).forEach(p => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl border border-orange-100 shadow-sm overflow-hidden">
                        <div class="bg-gradient-to-r from-orange-500 to-amber-600 p-4 relative flex items-center space-x-4">
                            <div class="w-16 h-16 rounded-full border-2 border-white bg-orange-100 overflow-hidden flex items-center justify-center">
                                <img src="${p.avatar}" class="w-14 h-14" alt="Avatar">
                            </div>
                            <div class="text-white flex-1">
                                <h3 class="text-lg font-bold">${p.name}</h3>
                                <p class="text-xs text-orange-100">${p.degree}</p>
                            </div>
                            <span class="absolute top-4 right-4 bg-white text-orange-700 text-[10px] font-bold px-2 py-0.5 rounded-full">${localization[currentLang].verified}</span>
                        </div>
                        <div class="grid grid-cols-4 gap-1 p-3 text-center bg-orange-50/40 border-b border-orange-50 text-[11px]">
                            <div><span class="block font-bold text-puja-dark">${p.experience}</span><span class="text-gray-500">${localization[currentLang].experience}</span></div>
                            <div><span class="block font-bold text-puja-dark">${p.totalPuja}</span><span class="text-gray-500">${localization[currentLang].totalPuja}</span></div>
                            <div><span class="block font-bold text-[#E65100]">${p.rating}</span><span class="text-gray-500">${localization[currentLang].rating}</span></div>
                            <div><span class="block font-bold text-puja-dark">${p.reviews}</span><span class="text-gray-500">${localization[currentLang].reviews}</span></div>
                        </div>
                        <div class="p-3 flex justify-between items-center">
                            <span class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">${localization[currentLang].available}</span>
                            <div class="flex items-center space-x-4">
                                <span class="text-xs font-bold text-gray-700">₹${p.fees}</span>
                                <button onclick="openBookingModal(${p.id})" class="bg-puja-orange text-white text-xs px-3 py-1.5 rounded-xl font-bold">${localization[currentLang].btnBook}</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = localization[lang];
            document.getElementById("app-subtitle").innerText = t.subtitle;
            document.getElementById("text-tab-purohit").innerText = t.tabPurohit;
            document.getElementById("text-tab-features").innerText = t.tabFeatures;
            document.getElementById("text-create-title").innerHTML = `<i class="fa-solid fa-user-plus mr-1 text-puja-orange"></i> ${t.createTitle}`;
            document.getElementById("lbl-name").innerText = t.lblName;
            document.getElementById("lbl-degree").innerText = t.lblDegree;
            document.getElementById("lbl-exp").innerText = t.lblExp;
            document.getElementById("lbl-fees").innerText = t.lblFees;
            document.getElementById("lbl-loc").innerText = t.lblLoc;
            document.getElementById("btn-submit-profile").innerText = t.btnSubmitProfile;
            document.getElementById("panjika-header").innerText = t.panjikaHeader;
            document.getElementById("panjika-date-lbl").innerText = t.panjikaDateLbl;
            document.getElementById("panjika-date").innerText = t.panjikaDate;
            document.getElementById("panjika-tithi-lbl").innerText = t.panjikaTithiLbl;
            document.getElementById("panjika-tithi").innerText = t.panjikaTithi;
            document.getElementById("panjika-nakshatra-lbl").innerText = t.panjikaNakshatraLbl;
            document.getElementById("panjika-nakshatra").innerText = t.panjikaNakshatra;
            document.getElementById("panjika-muhurta-lbl").innerText = t.panjikaMuhurtaLbl;
            document.getElementById("panjika-muhurta").innerText = t.panjikaMuhurta;
            document.getElementById("donation-header").innerText = t.donationHeader;
            document.getElementById("lbl-don-cat").innerText = t.lblDonCat;
            document.getElementById("don-cat-1").innerText = t.donCat1;
            document.getElementById("don-cat-2").innerText = t.donCat2;
            document.getElementById("don-cat-3").innerText = t.donCat3;
            document.getElementById("don-cat-4").innerText = t.donCat4;
            document.getElementById("don-cat-5").innerText = t.donCat5;
            document.getElementById("lbl-don-name").innerText = t.lblDonName;
            document.getElementById("lbl-don-gotra").innerText = t.lblDonGotra;
            document.getElementById("lbl-don-amount").innerText = t.lblDonAmount;
            document.getElementById("btn-donate").innerText = t.btnDonate;
            document.getElementById("footer-search").placeholder = t.footerPlaceholder;
            renderProfiles();
        }

        function handleDonation(e) {
            e.preventDefault();
            const name = document.getElementById("don-name").value;
            const gotra = document.getElementById("don-gotra").value;
            const amt = document.getElementById("don-amount").value;
            const catId = document.querySelector('input[name="don_category"]:checked').value;
            const catTxt = document.getElementById("don-" + catId.replace("_", "-")).innerText;
            
            alert(`✨ সংকল্প ও দান সফল হয়েছে! ✨\n\nदाता: ${name}\nगोत्र: ${gotra}\nখাত: ${catTxt}\nপরিমাণ: ₹${amt}`);
            document.getElementById("don-name").value = "";
            document.getElementById("don-gotra").value = "";
            document.getElementById("don-amount").value = "";
        }

        function openBookingModal(id) {
            document.getElementById("modal-purohit-id").value = id;
            document.getElementById("booking-modal").classList.remove("hidden");
        }

        function closeBookingModal() {
            document.getElementById("booking-modal").classList.add("hidden");
        }

        function confirmBooking(e) {
            e.preventDefault();
            alert(`✅ বুকিং নিশ্চিতকরণ সফল হয়েছে!\nনাম: ${document.getElementById("b-user").value}\nপূজা: ${document.getElementById("b-puja").value}`);
            closeBookingModal();
        }
    </script>
</body>
</html>
